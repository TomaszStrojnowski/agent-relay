apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
spec:
  # One replica: on first start the app creates its tables, and two pods doing
  # that at once can collide in PostgreSQL's catalog.
  replicas: 1
  selector:
    matchLabels:
      app: agent-relay
  template:
    metadata:
      labels:
        app: agent-relay
    spec:
      # Kubernetes has no depends_on. Without this the API starts first, fails
      # to create its tables, and crash-loops until PostgreSQL happens to be up.
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
        - name: api
          # Loaded into kind with `kind load docker-image`; CI replaces the tag
          # with a unique one per build via `kubectl set image`.
          image: agent-relay:local
          # Never pull: the image exists only inside the kind node.
          imagePullPolicy: Never
          env:
            - name: RELAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: RELAY_DATABASE_URL
          ports:
            - containerPort: 8000
          # /ready queries the real tables, so traffic only arrives once the
          # database is reachable and the schema exists.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent-relay
spec:
  selector:
    app: agent-relay
  ports:
    - port: 8000
      targetPort: 8000
