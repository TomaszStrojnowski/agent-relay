# PostgreSQL for Agent Relay. The Service is named `postgres`, so the API
# reaches it at the hostname `postgres`, exactly as in compose.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: relay
  POSTGRES_PASSWORD: relay
  POSTGRES_DB: relay
  # Read by the API. Kept beside the credentials it is built from.
  RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
---
# Persistent storage: deleting the pod must not delete the queue.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  # One pod owns the volume. Recreate stops the old pod before starting the
  # new one, so two PostgreSQL processes never open the same data directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # The volume's root holds lost+found; PostgreSQL needs an empty dir.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U relay -d relay"]
            periodSeconds: 3
            failureThreshold: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
